version: "3.9"

services:
  agi:
    build: .
    container_name: xauusd-agi
    env_file:
      - .env
    volumes:
      - ./.state_cache:/app/.state_cache
    restart: unless-stopped
    command: python main.py loop
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.exists('.state_cache')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
